# Single source of truth for VNDB Kotlin application version (R4).
# Read by app/build.gradle.kts to populate defaultConfig.versionName,
# defaultConfig.versionCode, BuildConfig.VERSION_NAME, and AppInfo.USER_AGENT.
#
# How to bump and tag a release:
#   1. Update VERSION_NAME (SemVer: MAJOR.MINOR.PATCH) and increment VERSION_CODE
#      (recommended formula: MAJOR * 10000 + MINOR * 100 + PATCH, e.g. 3.6.0 -> 30600).
#   2. Move the [Unreleased] section in CHANGELOG.md to [<VERSION_NAME>] - YYYY-MM-DD.
#   3. Commit: git commit -am "chore(release): v<VERSION_NAME>"
#   4. Tag:    git tag -a v<VERSION_NAME> -m "VNDB Kotlin v<VERSION_NAME>"
#   5. Push:   git push origin main --tags
VERSION_NAME=3.6.0
VERSION_CODE=30600
