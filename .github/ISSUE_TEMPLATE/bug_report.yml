name: Bug Report
description: Report a crash, incorrect behavior, or UI/sync issue in VNDB Kotlin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please never include your VNDB Personal Access Token in issue reports.
  - type: input
    id: app_version
    attributes:
      label: App Version
      description: Version shown in Others -> About VNDB Kotlin
      placeholder: "3.6.0"
    validations:
      required: true
  - type: input
    id: android_device
    attributes:
      label: Android Version & Device
      description: e.g., Android 15 (API 35), Pixel 8
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior
      placeholder: |
        1. Open Search tab
        2. Select 'Characters & Traits'
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Logs
      description: What happened instead? Attach screenshots or sanitized logcat output if available.
    validations:
      required: true
